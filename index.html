<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Restaurant for Monsters</title>
  <meta name="description" content="A cozy-spooky cooking game. You've inherited a diner whose regulars are vampires, swamp creatures and a very polite kraken. Decode their riddle orders and cook up something monstrous.">
  <meta name="theme-color" content="#170f22">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Restaurant for Monsters">
  <meta property="og:description" content="Fine dining for the dearly un-departed. A cozy-spooky cooking game.">

  <!-- Fonts (Griffy + Nunito) are self-hosted in assets/fonts/ — see css/base.css -->
  <link rel="preload" href="assets/fonts/Griffy-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Nunito-Variable.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dining.css">
  <link rel="stylesheet" href="css/kitchen.css">
  <link rel="stylesheet" href="css/build.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <noscript><p style="padding:2em">Restaurant for Monsters needs JavaScript turned on. The monsters are hungry!</p></noscript>

  <!-- Title screen -->
  <section id="screen-title" class="screen" aria-label="Title screen"></section>

  <!-- Main game -->
  <section id="screen-game" class="screen" aria-label="Restaurant">
    <header id="hud"></header>
    <main id="game-main">
      <!-- During a shift: dining room + kitchen (side by side on desktop, tabs on phones) -->
      <div id="view-shift" class="view" data-pane="dining">
        <nav class="pane-tabs" aria-label="Switch view">
          <button class="pane-tab active" data-pane="dining">🍽️ Dining Room</button>
          <button class="pane-tab" data-pane="kitchen">🫕 Kitchen <span id="kitchen-badge" class="badge hidden">0</span></button>
        </nav>
        <section id="dining-pane" aria-label="Dining room"></section>
        <section id="kitchen-pane" class="scroll" aria-label="Kitchen"></section>
        <button id="close-up-btn" class="btn primary hidden">🔒 Close up for the night</button>
      </div>
      <!-- Between shifts -->
      <div id="view-hub" class="view scroll"></div>
      <!-- Build Mode -->
      <div id="view-build" class="view scroll"></div>
    </main>
  </section>

  <!-- Monster Food Awards -->
  <section id="screen-awards" class="screen" aria-label="Monster Food Awards"></section>

  <!-- Overlay layers -->
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="fx-root" aria-hidden="true"></div>
  <div id="coach-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
